# Builds Block Arduino for macOS, Windows and Linux on native runners.
#
# Releasing: bump "version" in package.json, add a matching section to
# CHANGELOG.md and push to main. If no release exists yet for that version,
# this workflow tags the commit (vX.Y.Z), publishes a GitHub Release with all
# installers and refreshes the downloads page. Pushing a vX.Y.Z tag works too.
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Is this a new version?
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then echo "release=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VER" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VER"; exit 1
          fi
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VER already exists — building only."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will publish v$VER."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            args: --linux
          - os: windows-latest
            name: windows
            args: --win
          - os: macos-latest
            name: macos
            args: --mac dmg zip --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Fetch arduino-cli for this platform
        run: node tools/fetch-arduino-cli.js
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz

  release:
    needs: [test, build]
    if: needs.test.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Release notes from CHANGELOG.md
        run: |
          VER="${{ needs.test.outputs.version }}"
          awk -v v="$VER" '$0 ~ "^## \\[?v?"v"\\]?" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Block Arduino v$VER" > notes.md
          cat notes.md
          ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Block Arduino v${{ needs.test.outputs.version }}
          body_path: notes.md
          files: artifacts/*
          fail_on_unmatched_files: true
      - name: Refresh the downloads page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
