# Publishes the downloads / version history site (docs/) to the gh-pages
# branch, which GitHub Pages serves. The page reads the Releases API in the
# browser, so new versions appear by themselves; this also snapshots the
# release list as a fallback for when the API is rate-limited.
name: Deploy downloads page

on:
  push:
    branches: [main]
    paths: ['docs/**', 'CHANGELOG.md', '.github/workflows/pages.yml']
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site && cp -r docs/. site/
          cp CHANGELOG.md site/CHANGELOG.md
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > site/releases.json || echo "[]" > site/releases.json
          touch site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy downloads page from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
